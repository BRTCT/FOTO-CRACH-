  .topo{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--borda);padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));display:flex;align-items:center;gap:10px;}
  .topo .flex{flex:1;min-width:0;}
  .topo h1{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topo small{display:block;font-size:12px;color:var(--fraco);}
  .ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--borda);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#3a3a3a;cursor:pointer;flex-shrink:0;}
  .ib:active{transform:scale(.95);background:#f4f4f4;}
  .conteudo{padding:16px;flex:1;}

  /* PIN */
  .pin-box{max-width:360px;margin:0 auto;padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;justify-content:center;}
  .pin-box h2{font-size:21px;font-weight:800;margin-top:6px;}
  .pin-box p{color:var(--fraco);font-size:14px;}
  .pontos{display:flex;gap:14px;margin:8px 0 6px;}
  .pontos i{width:16px;height:16px;border-radius:50%;border:2px solid #bdbdbd;transition:all .15s;}
  .pontos i.on{background:#1f1f1f;border-color:#1f1f1f;transform:scale(1.1);}
  .pontos.erro{animation:treme .4s;} .pontos.erro i{border-color:#d9433b;}
  @keyframes treme{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
  .teclado{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:6px;}
  .teclado button{height:64px;border-radius:18px;border:1px solid var(--borda);background:#fff;font-size:24px;font-weight:600;color:#1f1f1f;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .teclado button:active{background:#ececec;transform:scale(.96);}
  .teclado button.vazio{visibility:hidden;}
  .msg{min-height:20px;font-size:13px;color:#b3261e;}

  .campo{width:100%;border:1px solid #d9d9d9;border-radius:14px;padding:14px 15px;font-size:16px;background:#fff;}
  .campo:focus{outline:none;border-color:#8a8a8a;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #1f1f1f;background:#1f1f1f;color:#fff;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:600;cursor:pointer;width:100%;}
  .btn:active{transform:scale(.98);}
  .btn.claro{background:#fff;color:#1f1f1f;border-color:#d9d9d9;}
  .btn:disabled{opacity:.55;}

  /* escolha do controle */
  .ola{font-size:14px;color:var(--fraco);margin-bottom:14px;}
  .ola b{color:var(--texto);}
  .opcoes{display:grid;gap:14px;}
  .op{position:relative;overflow:hidden;text-align:left;border:1px solid var(--borda);background:#fff;border-radius:20px;padding:20px 18px;cursor:pointer;display:flex;align-items:center;gap:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.05);animation:entra .45s cubic-bezier(.2,.8,.3,1) both;transition:transform .2s;}
  .op:nth-child(2){animation-delay:.08s;}
  .op:active{transform:scale(.98);}
  .op::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);}
  .op .ic{width:56px;height:56px;border-radius:16px;background:var(--c2);color:var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .op b{display:block;font-size:20px;font-weight:800;}
  .op small{display:block;font-size:13px;color:var(--fraco);margin-top:3px;}
  .op .seta{margin-left:auto;color:#9a9a9a;}

  /* lista */
  .busca{position:sticky;top:61px;z-index:4;background:#f6f7f4;padding:12px 16px 8px;}
  .filtro{display:flex;gap:8px;margin-top:8px;}
  .filtro button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:#3a3a3a;cursor:pointer;}
  .filtro button.on{background:#1f1f1f;border-color:#1f1f1f;color:#fff;}
  .lista{padding:4px 16px 30px;display:flex;flex-direction:column;gap:9px;}
  .pessoa{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--borda);border-radius:16px;padding:12px 13px;cursor:pointer;text-align:left;width:100%;animation:entra .3s both;}
  .pessoa:active{transform:scale(.985);background:#fafafa;}
  .pessoa .av{width:44px;height:44px;border-radius:14px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#5a5a5a;flex-shrink:0;}
  .pessoa .av.tem{background:#e2f2df;color:#1e6b2d;}
  .pessoa .tx{flex:1;min-width:0;}
  .pessoa .tx b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;}
  .pessoa .tx small{display:block;font-size:12px;color:var(--fraco);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pessoa .st{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap;}
  .st.ok{background:#e2f2df;color:#1e6b2d;} .st.nao{background:#f1f1f1;color:#6b6b6b;}
  .vazio{text-align:center;color:var(--fraco);padding:30px 10px;font-size:14px;}

  /* câmera */
  .cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;}
  .cam-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top));background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,0));color:#fff;}
  .cam-top .flex{flex:1;min-width:0;} .cam-top b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .cam-top small{font-size:12px;opacity:.8;}
  .cam .ib{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;}
  .cam video,.cam img.prev{flex:1;width:100%;height:100%;object-fit:cover;background:#000;}
  .cam img.prev{object-fit:contain;}
  .cam-rod{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 20px;padding-bottom:max(22px, env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0));}
  .disparo{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;position:relative;}
  .disparo::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff;transition:transform .12s;}
  .disparo:active::after{transform:scale(.88);}
  .cam-rod .lado{width:52px;display:flex;justify-content:center;}
  .cam-rod .btn{width:auto;flex:1;}
  .flash{position:fixed;inset:0;background:#fff;z-index:30;opacity:0;pointer-events:none;}
  .flash.on{animation:flash .35s ease;}
  @keyframes flash{0%{opacity:.85;}100%{opacity:0;}}
  .cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:30px;font-size:15px;line-height:1.5;}
  .enviando{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:15px;}
  .roda{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:gira .8s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}
  .ok-anim{width:76px;height:76px;border-radius:50%;background:#2e9e44;display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both;}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:none;opacity:1;}}
  .toast{position:fixed;left:16px;right:16px;bottom:max(18px, env(safe-area-inset-bottom));background:#1f1f1f;color:#fff;padding:13px 16px;border-radius:14px;font-size:14px;z-index:50;opacity:0;transform:translateY(10px);transition:all .25s;text-align:center;}
  .toast.on{opacity:1;transform:none;} .toast.erro{background:#b3261e;}
</style>
</head>
<body>

<!-- PIN -->
<div class="tela" id="t-pin">

<!-- nome do técnico -->

<!-- escolha PCV / Crachá -->
<div class="tela hidden" id="t-inicio">
  <div class="topo"><div class="logo" style="width:120px;height:34px"></div><div class="flex"></div><button class="ib" id="bt-sair" title="Sair"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></button></div>
  <div class="conteudo">
    <div class="ola">Olá, <b id="ola-nome"></b>. Escolha o controle:</div>
    <div class="opcoes">
      <button class="op" data-c="pcv" style="--c:#1d6fa5;--c2:#e8f1f9"><span class="ic"><svg class="ico" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span><span><b>PCV</b><small id="n-pcv">carregando...</small></span><span class="seta"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
      <button class="op" data-c="cracha" style="--c:#4a7a26;--c2:#edf5e6"><span class="ic"><svg class="ico" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg></span><span><b>Crachá Crítico</b><small id="n-cracha">carregando...</small></span><span class="seta"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
    </div>
  </div>
</div>

<!-- lista de colaboradores -->
<div class="tela hidden" id="t-lista">
  <div class="topo"><button class="ib" id="bt-voltar" title="Voltar"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button><div class="flex"><h1 id="lista-tit"></h1><small id="lista-sub"></small></div></div>
  <div class="busca">
    <input class="campo" id="busca" placeholder="Buscar colaborador..." autocomplete="off">
    <div class="filtro" id="filtro"><button data-f="" class="on">Todos</button><button data-f="sem">Sem foto</button><button data-f="com">Com foto</button></div>
  </div>
  <div class="lista" id="lista"></div>
</div>

<!-- câmera -->
<div class="cam hidden" id="t-cam">
  <div class="cam-top"><button class="ib" id="cam-x" title="Fechar"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div class="flex"><b id="cam-nome"></b><small id="cam-sub"></small></div><button class="ib" id="cam-virar" title="Trocar câmera"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg></button></div>
  <video id="video" playsinline autoplay muted></video>
  <img class="prev hidden" id="prev" alt="">
  <div class="cam-msg hidden" id="cam-msg"></div>
  <div class="cam-rod" id="rod-tirar">
    <div class="lado"><button class="ib" id="cam-galeria" title="Escolher da galeria"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button></div>
    <button class="disparo" id="disparo" aria-label="Tirar foto"></button>
    <div class="lado"></div>
  </div>
  <div class="cam-rod hidden" id="rod-prev">
    <button class="btn claro" id="outra">Tirar outra</button>
    <button class="btn" id="usar" style="background:#2e9e44;border-color:#2e9e44">Usar foto</button>
  </div>
  <input type="file" id="arq" accept="image/*" capture="environment" hidden>
</div>
<div class="flash" id="flash"></div>
<div class="enviando hidden" id="enviando"><div class="roda" id="env-roda"></div><div id="env-txt">Enviando foto...</div></div>
<div class="toast" id="toast"></div>
<canvas id="canvas" hidden></canvas>

<script>
/* ================= FOTOS DE CAMPO (link dos técnicos, sem login) =================
   Acesso: link com código (?k=...) + PIN de 4 dígitos (tabela tecnico_acesso).
   PCV: colaboradores de emb_doc_pcv · Crachá Crítico: colaboradores de emb_cracha_nr.
   A foto vai para o Storage (pasta privada "embarque-fotos", <controle>/<nome>.jpg,
   substituindo a anterior) e o registro para emb_fotos. Ela aparece no Embarque
   Taboca, ao lado do nome do colaborador, nos controles PCV e Crachá Crítico. */
var SB_URL = 'https://dzkxbvcxasvokdvjsmeb.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6a3hidmN4YXN2b2tkdmpzbWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjk0MTUsImV4cCI6MjEwMjc0NTQxNX0.bRcgkjme7bV6Bju7B2yjErvR2VqWrY69SQ0pvmENKuk';
var SESSAO = 'fotos_campo_sessao', NOME_TEC = 'fotos_campo_tecnico', DURACAO = 12 * 3600 * 1000;
/* código do acesso: vem do link (?k=...); sem ele, usa o padrão desta página
   (assim o endereço curto também funciona; o PIN continua sendo pedido) */
var CODIGO_PADRAO = 'a10a2714f638f29bc1de0dde';
var CODIGO = (new URLSearchParams(location.search).get('k') || (location.hash.match(/k=([\w-]+)/) || [])[1] || CODIGO_PADRAO).trim();
var ST = { controle:null, pessoas:{ pcv:[], cracha:[] }, fotos:{ pcv:{}, cracha:{} }, filtro:'', alvo:null, stream:null, frente:false, blob:null };
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function chave(n){ return String(n || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
function slug(n){ return norm(n).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'colaborador'; }
var tT; function toast(m, erro){ var t = $('toast'); t.textContent = m; t.className = 'toast on' + (erro ? ' erro' : ''); clearTimeout(tT); tT = setTimeout(function(){ t.className = 'toast'; }, erro ? 5000 : 2600); }
function tela(id){ ['t-pin','t-nome','t-inicio','t-lista'].forEach(function(t){ $(t).classList.toggle('hidden', t !== id); }); window.scrollTo(0, 0); }
function api(caminho, op){
  op = op || {};
  return fetch(SB_URL + '/rest/v1/' + caminho, { method: op.method || 'GET', headers: Object.assign({ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json' }, op.headers || {}), body: op.body })
    .then(function(r){ return r.text().then(function(t){ if(!r.ok) throw new Error(t || ('HTTP ' + r.status)); return t ? JSON.parse(t) : null; }); });
}
async function sha(t){ var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.prototype.map.call(new Uint8Array(b), function(x){ return x.toString(16).padStart(2, '0'); }).join(''); }

/* ---------- PIN ---------- */
var PIN = '';
function montarTeclado(){
  $('teclado').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','<'].map(function(k){ return '<button type="button"' + (k === '' ? ' class="vazio"' : '') + ' data-k="' + k + '">' + (k === '<' ? '&#9003;' : k) + '</button>'; }).join('');
  $('teclado').onclick = function(e){ var b = e.target.closest('button'); if(!b || !b.dataset.k && b.dataset.k !== '0') return; tecla(b.dataset.k); };
  document.addEventListener('keydown', function(e){ if($('t-pin').classList.contains('hidden')) return; if(/^\d$/.test(e.key)) tecla(e.key); else if(e.key === 'Backspace') tecla('<'); });
}
function pontos(){ $('pontos').querySelectorAll('i').forEach(function(i, n){ i.classList.toggle('on', n < PIN.length); }); }
function tecla(k){
  if(k === '<'){ PIN = PIN.slice(0, -1); pontos(); return; }
  if(PIN.length >= 4) return;
  PIN += k; pontos(); $('pin-msg').textContent = '';
  if(PIN.length === 4) conferirPin();
}
async function conferirPin(){
  try{
    var r = (await api('tecnico_acesso?select=pin_hash,ativo&codigo=eq.' + encodeURIComponent(CODIGO)))[0];
    if(!r || r.ativo === false) throw new Error('link');
    if(await sha(CODIGO + ':' + PIN) !== r.pin_hash) throw new Error('pin');
    try{ localStorage.setItem(SESSAO, JSON.stringify({ k:CODIGO, ate:Date.now() + DURACAO })); }catch(e){}
    PIN = ''; pontos(); depoisDoPin();
  } catch(e){
    var m = String(e.message || e);
    $('pin-msg').textContent = m === 'pin' ? 'PIN incorreto.' : m === 'link' ? 'Este link não está mais ativo. Peça o link novo ao SESMT.' : 'Sem conexão com o servidor. Tente de novo.';
    $('pontos').classList.add('erro'); setTimeout(function(){ $('pontos').classList.remove('erro'); PIN = ''; pontos(); }, 450);
  }
}
function sessaoValida(){ try{ var s = JSON.parse(localStorage.getItem(SESSAO) || 'null'); return s && s.k === CODIGO && s.ate > Date.now(); }catch(e){ return false; } }
function nomeTec(){ try{ return localStorage.getItem(NOME_TEC) || ''; }catch(e){ return ''; } }
function depoisDoPin(){
  if(!nomeTec()){ tela('t-nome'); setTimeout(function(){ $('nome-tec').focus(); }, 200); return; }
  inicio();
}

/* ---------- dados ---------- */
function pagina(tab, sel, ordem){
  var todos = [];
  function pag(ini){ return api(tab + '?select=' + sel + '&order=' + ordem + '&limit=1000&offset=' + ini).then(function(r){ r = r || []; todos = todos.concat(r); return r.length === 1000 ? pag(ini + 1000) : todos; }); }
  return pag(0);
}
async function carregar(){
  var res = await Promise.all([
    pagina('emb_doc_pcv', 'colaborador,cc,funcao,status', 'colaborador.asc').catch(function(){ return []; }),
    pagina('emb_cracha_nr', 'colaborador,cc,cargo', 'colaborador.asc').catch(function(){ return []; }),
    pagina('emb_fotos', 'controle,colaborador,tirada_em,tecnico', 'colaborador.asc').catch(function(){ return []; })
  ]);
  function unicos(rows, campoFuncao, pular){
    var m = {};
    rows.forEach(function(r){ var k = chave(r.colaborador); if(!k || (pular && pular(r))) return; if(!m[k]) m[k] = { nome:k, cc:r.cc || '', funcao:r[campoFuncao] || '' }; });
    return Object.keys(m).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); }).map(function(k){ return m[k]; });
  }
  ST.pessoas.pcv = unicos(res[0], 'funcao', function(r){ return /cancel/i.test(r.status || ''); });
  ST.pessoas.cracha = unicos(res[1], 'cargo');
  ST.fotos = { pcv:{}, cracha:{} };
  res[2].forEach(function(f){ if(ST.fotos[f.controle]) ST.fotos[f.controle][chave(f.colaborador)] = f; });
  contadores();
}
function contadores(){
  ['pcv','cracha'].forEach(function(c){
    var n = ST.pessoas[c].length, com = ST.pessoas[c].filter(function(p){ return ST.fotos[c][p.nome]; }).length;
    $('n-' + c).textContent = n + ' colaborador' + (n === 1 ? '' : 'es') + ' · ' + com + ' com foto';
  });
}

/* ---------- telas ---------- */
async function inicio(){
  $('ola-nome').textContent = nomeTec().split(' ')[0];
  tela('t-inicio');
  try{ await carregar(); }catch(e){ toast('Não foi possível carregar os colaboradores. Verifique a internet.', true); }
}
function abrirLista(c){
  ST.controle = c; $('busca').value = ''; ST.filtro = '';
  $('filtro').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.f === ''); });
  $('lista-tit').textContent = c === 'pcv' ? 'PCV' : 'Crachá Crítico';
  tela('t-lista'); desenharLista();
}
function iniciais(n){ return String(n || '?').trim().split(/\s+/).filter(function(p){ return p.length > 2; }).map(function(p){ return p[0]; }).slice(0, 2).join('') || n[0]; }
function desenharLista(){
  var c = ST.controle, q = norm($('busca').value).split(/\s+/).filter(Boolean);
  var L = ST.pessoas[c].filter(function(p){
    var tem = !!ST.fotos[c][p.nome];
    if(ST.filtro === 'sem' && tem) return false; if(ST.filtro === 'com' && !tem) return false;
    var t = norm(p.nome + ' ' + p.cc + ' ' + p.funcao); return q.every(function(x){ return t.indexOf(x) >= 0; });
  });
  var com = ST.pessoas[c].filter(function(p){ return ST.fotos[c][p.nome]; }).length;
  $('lista-sub').textContent = ST.pessoas[c].length + ' colaboradores · ' + com + ' com foto';
  $('lista').innerHTML = L.length ? L.map(function(p, i){
    var f = ST.fotos[c][p.nome];
    return '<button class="pessoa" data-n="' + esc(p.nome) + '" style="animation-delay:' + Math.min(i, 15) * 18 + 'ms"><span class="av' + (f ? ' tem' : '') + '">' + esc(iniciais(p.nome)) + '</span>'
      + '<span class="tx"><b>' + esc(p.nome) + '</b><small>' + esc([p.cc ? 'CC ' + p.cc : '', p.funcao].filter(Boolean).join(' · ') || '-') + '</small></span>'
      + '<span class="st ' + (f ? 'ok">&#10003; ' + new Date(f.tirada_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) : 'nao">sem foto') + '</span></button>';
  }).join('') : '<div class="vazio">' + (ST.pessoas[c].length ? 'Ninguém encontrado.' : 'Nenhum colaborador cadastrado neste controle.') + '</div>';
  $('lista').querySelectorAll('.pessoa').forEach(function(b){ b.onclick = function(){ abrirCamera(b.dataset.n); }; });
}

/* ---------- câmera ---------- */
async function abrirCamera(nome){
  ST.alvo = nome; ST.blob = null;
  $('cam-nome').textContent = nome;
  var f = ST.fotos[ST.controle][nome];
  $('cam-sub').textContent = (ST.controle === 'pcv' ? 'PCV' : 'Crachá Crítico') + (f ? ' · a foto nova substitui a de ' + new Date(f.tirada_em).toLocaleDateString('pt-BR') : '');
  $('t-cam').classList.remove('hidden'); modoTirar();
  await ligarCamera();
}
function modoTirar(){ $('prev').classList.add('hidden'); $('video').classList.remove('hidden'); $('rod-prev').classList.add('hidden'); $('rod-tirar').classList.remove('hidden'); }
async function ligarCamera(){
  pararCamera(); $('cam-msg').classList.add('hidden');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ semCamera('Este navegador não abre a câmera aqui. Toque no botão da galeria para tirar a foto pelo app de câmera.'); return; }
  try{
    ST.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: ST.frente ? 'user' : { ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
    var v = $('video'); v.srcObject = ST.stream; await v.play().catch(function(){});
  } catch(e){ semCamera('Não foi possível abrir a câmera (' + (e.name === 'NotAllowedError' ? 'permissão negada' : (e.message || e.name)) + '). Libere a câmera nas permissões do navegador ou toque no botão da galeria para usar o app de câmera.'); }
}
function semCamera(t){ $('cam-msg').textContent = t; $('cam-msg').classList.remove('hidden'); $('disparo').disabled = true; }
function pararCamera(){ if(ST.stream){ ST.stream.getTracks().forEach(function(t){ t.stop(); }); ST.stream = null; } $('disparo').disabled = false; }
function fecharCamera(){ pararCamera(); $('t-cam').classList.add('hidden'); }
function reduzir(fonte, w, h){
  var max = 1600, r = Math.min(1, max / Math.max(w, h)), c = $('canvas');
  c.width = Math.round(w * r); c.height = Math.round(h * r);
  c.getContext('2d').drawImage(fonte, 0, 0, c.width, c.height);
  return new Promise(function(ok){ c.toBlob(function(b){ ok(b); }, 'image/jpeg', 0.82); });
}
async function disparar(){
  var v = $('video'); if(!v.videoWidth) return;
  $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on');
  if(navigator.vibrate) navigator.vibrate(30);
  mostrarPrevia(await reduzir(v, v.videoWidth, v.videoHeight));
}
function mostrarPrevia(blob){
  ST.blob = blob; pararCamera();
  var p = $('prev'); p.src = URL.createObjectURL(blob); p.classList.remove('hidden'); $('video').classList.add('hidden'); $('cam-msg').classList.add('hidden');
  $('rod-tirar').classList.add('hidden'); $('rod-prev').classList.remove('hidden');
}
function daGaleria(file){
  if(!file) return;
  var img = new Image();
  img.onload = async function(){ mostrarPrevia(await reduzir(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); };
  img.onerror = function(){ toast('Não foi possível ler a imagem.', true); };
  img.src = URL.createObjectURL(file);
}
async function enviar(){
  if(!ST.blob) return;
  var c = ST.controle, nome = ST.alvo, caminho = c + '/' + slug(nome) + '.jpg';
  $('enviando').classList.remove('hidden'); $('env-roda').className = 'roda'; $('env-roda').innerHTML = ''; $('env-txt').textContent = 'Enviando foto...';
  try{
    var r = await fetch(SB_URL + '/storage/v1/object/embarque-fotos/' + caminho, { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'image/jpeg', 'x-upsert':'true', 'cache-control':'no-cache' }, body:ST.blob });
    if(!r.ok){ var t = await r.text(); throw new Error(t); }
    var reg = { controle:c, colaborador:nome, caminho:caminho, tirada_em:new Date().toISOString(), tecnico:nomeTec() };
    await api('emb_fotos?on_conflict=controle,colaborador', { method:'POST', body:JSON.stringify(reg), headers:{ Prefer:'resolution=merge-duplicates,return=minimal' } });
    ST.fotos[c][nome] = reg;
    $('env-roda').className = 'ok-anim'; $('env-roda').innerHTML = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    $('env-txt').textContent = 'Foto salva!';
    if(navigator.vibrate) navigator.vibrate([20, 40, 20]);
    setTimeout(function(){ $('enviando').classList.add('hidden'); fecharCamera(); contadores(); desenharLista(); }, 900);
  } catch(e){
    $('enviando').classList.add('hidden');
    var m = String(e.message || e);
    toast(/bucket|policy|security|403|42P01|emb_fotos/i.test(m) ? 'O servidor recusou a foto: falta configurar o Supabase (sesmt_fotos_campo.sql).' : 'Não foi possível enviar. Verifique a internet e tente de novo.', true);
  }
}

/* ---------- eventos ---------- */
montarTeclado();
$('nome-ok').onclick = function(){ var n = $('nome-tec').value.trim(); if(n.length < 3){ toast('Digite seu nome.', true); return; } try{ localStorage.setItem(NOME_TEC, n.toUpperCase()); }catch(e){} inicio(); };
$('nome-tec').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('nome-ok').click(); });
document.querySelectorAll('.op').forEach(function(b){ b.onclick = function(){ abrirLista(b.dataset.c); }; });
$('bt-voltar').onclick = function(){ tela('t-inicio'); contadores(); };
$('bt-sair').onclick = function(){ try{ localStorage.removeItem(SESSAO); }catch(e){} PIN = ''; pontos(); tela('t-pin'); };
$('busca').addEventListener('input', desenharLista);
$('filtro').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; ST.filtro = b.dataset.f; $('filtro').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); desenharLista(); };
$('cam-x').onclick = fecharCamera;
$('cam-virar').onclick = function(){ ST.frente = !ST.frente; modoTirar(); ligarCamera(); };
$('disparo').onclick = disparar;
$('cam-galeria').onclick = function(){ $('arq').click(); };
$('arq').onchange = function(e){ daGaleria(e.target.files[0]); e.target.value = ''; };
$('outra').onclick = function(){ ST.blob = null; modoTirar(); ligarCamera(); };
$('usar').onclick = enviar;
window.addEventListener('pagehide', pararCamera);
if(!CODIGO){ $('pin-txt').textContent = 'Link incompleto. Abra pelo link enviado pelo SESMT.'; $('teclado').classList.add('hidden'); $('pontos').classList.add('hidden'); }
else if(sessaoValida()) depoisDoPin();
</script>
